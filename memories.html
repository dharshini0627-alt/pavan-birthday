<!DOCTYPE html>
<html>
<head>
    <title>Just for you</title>
<style>
    body {
        text-align: center;
        margin: 0;
        padding: 20px;
    }
    h1{
        font-family: Georgia;
        font-size: 32px;
    }
  .gallery{
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        max-width: 1000px;
        margin: 30px auto;
}
.gallery img {
    width: 100%;
    height: 450px;
display: block;
}
a{
            display: inline-block;
            margin-top: 20px;
            padding: 10px 22px;
            font-family: Georgia;
            font-size: 17px;
            text-decoration: none;
            border-radius: 25px;
        }
        @media (max-width: 600px) {
            .gallery{
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .gallery img {
                height: auto;
            }
            h1{
                font-size: 26px;
            }            
        }
</style>
</head>
        <body>
            <h1> The Little Boy Who Became You</h1>
        <div class="gallery">
        <img src = "Baby_dad.jpeg" alt = "Pavan with dad">
        <img src = "Baby_family.jpeg" alt = "Pavan with family">
        <img src = "Baby sister.jpeg" alt = "Pavan with sister">
        <img src = "Baby_Boy.jpeg" alt = "Pavan">
    </div>
               <a href = "growing.html">Next</a>
        </body>
</html>
